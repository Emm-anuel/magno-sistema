services:
  postgres:
    image: postgres:16-alpine
    container_name: magno-postgres
    environment:
      POSTGRES_DB: magno_db
      POSTGRES_USER: magno
      POSTGRES_PASSWORD: magno123
    ports:
      - "5432:5432"
    volumes:
      - magno_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: magno-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: magno-minio
    environment:
      MINIO_ROOT_USER: magno
      MINIO_ROOT_PASSWORD: magno123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - magno_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-02-28T09-09-05Z
    container_name: magno-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 magno magno123456;
      mc mb --ignore-existing local/magno-files;
      mc anonymous set download local/magno-files;
      exit 0;
      "

volumes:
  magno_pgdata:
  magno_minio_data:
