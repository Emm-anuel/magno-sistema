server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API al backend
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy de mosaicos del mapa (same-origin para evitar bloqueos COEP/CORP)
    # ^~ evita que la regla regex de assets estaticos intercepte URLs .png de tiles
    location ^~ /tiles/osm/ {
        proxy_pass         https://tile.openstreetmap.org/;
        proxy_http_version 1.1;
        proxy_set_header   Host              tile.openstreetmap.org;
        proxy_set_header   Connection        "";
        proxy_ssl_verify   off;
        proxy_ssl_server_name on;
    }

    location ^~ /tiles/osmde/ {
        proxy_pass         https://tile.openstreetmap.de/;
        proxy_http_version 1.1;
        proxy_set_header   Host              tile.openstreetmap.de;
        proxy_set_header   Connection        "";
        proxy_ssl_verify   off;
        proxy_ssl_server_name on;
    }

    location ^~ /tiles/carto/ {
        proxy_pass         https://a.basemaps.cartocdn.com/light_all/;
        proxy_http_version 1.1;
        proxy_set_header   Host              a.basemaps.cartocdn.com;
        proxy_set_header   Connection        "";
        proxy_ssl_verify   off;
        proxy_ssl_server_name on;
    }

    # Proxy de geocodificacion para buscador de direcciones
    location /geocode/search {
        proxy_pass         https://nominatim.openstreetmap.org/search;
        proxy_http_version 1.1;
        proxy_set_header   Host              nominatim.openstreetmap.org;
        proxy_set_header   Connection        "";
        proxy_set_header   User-Agent        "MagnoSistema/1.0 (emmanuel.m.toledo@gmail.com)";
        proxy_set_header   Referer           "";
        proxy_ssl_verify   off;
        proxy_ssl_server_name on;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
