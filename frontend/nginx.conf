server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API al backend
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy de mosaicos del mapa (same-origin para evitar bloqueos COEP/CORP)
    location /tiles/osm/ {
        proxy_pass         https://tile.openstreetmap.org/;
        proxy_http_version 1.1;
        proxy_set_header   Host tile.openstreetmap.org;
    }

    location /tiles/osmde/ {
        proxy_pass         https://tile.openstreetmap.de/;
        proxy_http_version 1.1;
        proxy_set_header   Host tile.openstreetmap.de;
    }

    location /tiles/carto/ {
        proxy_pass         https://a.basemaps.cartocdn.com/light_all/;
        proxy_http_version 1.1;
        proxy_set_header   Host a.basemaps.cartocdn.com;
    }

    # Proxy de geocodificacion para buscador de direcciones
    location /geocode/search {
        proxy_pass         https://nominatim.openstreetmap.org/search;
        proxy_http_version 1.1;
        proxy_set_header   Host nominatim.openstreetmap.org;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
